name: Employee UI test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  employee-test:
    outputs:
      report-id: ${{ steps.report.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      URL: ${{ secrets.URL }}
      BRIGHTHR_EMAIL: ${{ secrets.BRIGHTHR_EMAIL }}
      BRIGHTHR_PASSWORD: ${{ secrets.BRIGHTHR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check required secrets
        shell: bash
        run: |
          for key in URL BRIGHTHR_EMAIL BRIGHTHR_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing repository secret: $key"
              exit 1
            fi
          done
      - name: Install dependencies
        run: npm ci
      - name: Install Chrome and system dependencies
        run: npx playwright install --with-deps chrome
      - name: Set up Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Allure history
        uses: actions/cache/restore@v4
        with:
          path: allure-report/history
          key: allure-history-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            allure-history-${{ runner.os }}-${{ github.ref_name }}-
      - name: Run employee test
        run: npm run test:employee
      - name: Redact report credentials
        if: ${{ !cancelled() }}
        id: redact
        run: npm run report:redact
      - name: Generate Allure dashboard
        if: ${{ !cancelled() && steps.redact.outcome == 'success' && hashFiles('allure-results/*-result.json') != '' }}
        id: allure
        run: npm run allure:generate
      - name: Upload Allure dashboard
        if: ${{ !cancelled() && steps.allure.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7
          if-no-files-found: error
      - name: Save Allure history
        if: ${{ !cancelled() && steps.allure.outcome == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v4
        with:
          path: allure-report/history
          key: allure-history-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload Playwright report
        id: report
        if: ${{ !cancelled() && steps.redact.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  publish-report:
    needs: employee-test
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.employee-test.outputs.report-id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Playwright report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report
      - name: Publish HTML report
        id: deployment
        uses: actions/deploy-pages@v4
